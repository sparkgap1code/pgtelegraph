plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = 'com.sparkgap.pgtelegraph'
base { archivesName = 'pgtelegraph' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.242'
    mods {
        pgtelegraph { sourceSet(sourceSets.main) }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // MP3 decoding for imported records (bundled inside our jar)
    jarJar(implementation("javazoom:jlayer:[1.0.1,)")) { version { prefer '1.0.1' } }
    jarJar(implementation("org.jcodec:jcodec:[0.2.5,)")) { version { prefer '0.2.5' } }
    // Power Grid, Create (+ its bundled libs) are compile-only; the game instance provides them.
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest { attributes('Implementation-Version': project.version) }
    from('LICENSE') { rename { 'LICENSE_pgtelegraph' } }
    from('NOTICE') { rename { 'NOTICE_pgtelegraph' } }
}
